[package]
name = "rmc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rmc-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
dbus = { version = "0.9.12", features = ["vendored"] }
futures-util = "0.3"
mime_guess = "2"
mpris = { version = "2", features = ["dbus-vendored"] }
rcgen = "0.14.10"
reqwest = { version = "0.13.5", features = ["blocking", "form", "json", "query"] }
rust-embed = "8.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
